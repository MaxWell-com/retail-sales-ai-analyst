[project]
name = "retail-sales-ai-analyst"
version = "1.0.0"
description = "LLM agent that answers natural-language questions about retail sell-out data with code-verified numbers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731", "B008", "B905", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
