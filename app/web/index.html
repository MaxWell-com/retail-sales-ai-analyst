<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-аналитик продаж в сетях</title>
<link rel="stylesheet" href="fonts.css">
<!-- ?v= — bump after an update, otherwise the browser serves stale app.js and chat.css from cache -->
<link rel="stylesheet" href="app.css?v=20261030">
<link rel="stylesheet" href="chat.css?v=20261105">
</head>
<body>
<header class="hdr">
  <!-- Decorative arcs in the header -->
  <div class="header-deco" aria-hidden="true">
    <svg class="header-rings" viewBox="0 0 820 200" preserveAspectRatio="xMaxYMin slice">
      <defs>
        <linearGradient id="rg0" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="820" y2="0"><stop offset="0" stop-color="#FF5C00"/><stop offset="1" stop-color="#FFB380"/></linearGradient>
        <linearGradient id="rg1" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="820" y2="0"><stop offset="0" stop-color="#FF8533"/><stop offset="1" stop-color="#FFD9BC"/></linearGradient>
        <linearGradient id="rg2" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="820" y2="0"><stop offset="0" stop-color="#FFB380"/><stop offset="1" stop-color="#FFE7D4"/></linearGradient>
        <linearGradient id="rg3" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="820" y2="0"><stop offset="0" stop-color="#FFC59B"/><stop offset="1" stop-color="#FFEBDA"/></linearGradient>
      </defs>
      <circle cx="520" cy="470" r="430" fill="none" stroke="url(#rg0)" stroke-width="38" stroke-dasharray="1125.7 1576.0" opacity=".75" transform="rotate(205 520 470)"/>
      <circle cx="700" cy="360" r="300" fill="none" stroke="url(#rg1)" stroke-width="30" stroke-dasharray="680.7 1204.3" opacity=".6" transform="rotate(215 700 360)"/>
      <circle cx="400" cy="620" r="580" fill="none" stroke="url(#rg2)" stroke-width="26" stroke-dasharray="1214.7 2429.5" opacity=".45" transform="rotate(210 400 620)"/>
      <circle cx="880" cy="300" r="200" fill="none" stroke="url(#rg3)" stroke-width="24" stroke-dasharray="558.5 698.1" opacity=".5" transform="rotate(195 880 300)"/>
    </svg>
  </div>
  <div class="head-top">
    <div class="head-title">
      <h1>ИИ-аналитик продаж в сетях</h1>
      <div class="head-scope" id="scope">Панель sell-out розничных сетей</div>
    </div>
    <div class="head-right"><div class="head-updated">Данные по <b id="asof">…</b> · модель <b id="model">…</b></div></div>
  </div>
  <nav id="nav" class="pagenav" aria-label="Разделы">
    <a href="#chat" data-p="chat">Аналитик</a>
    <a href="#data" data-p="data">Данные</a>
    <a href="#method" data-p="method">Методика</a>
    <a href="#eval" data-p="eval">Проверка</a>
  </nav>
</header>
<main class="wrap">
  <section id="p-chat">
    <div class="chat-grid">
      <aside class="side panel">
        <div class="ph"><h2>Диалоги</h2><button class="btn-accent" id="new">Новый</button></div>
        <div class="hist" id="hist"></div>
      </aside>
      <div class="chat">
        <div id="turns"></div>
        <div class="composer panel">
          <div class="cons" id="cons">
            <div class="fgroup"><span class="flabel">Период</span>
              <div class="seg" id="c-per">
                <button data-v="mat" class="active">12 месяцев</button>
                <button data-v="ytd">С начала года</button><button data-v="last">Последний месяц</button><button data-v="own">Свой</button>
              </div></div>
            <div class="fgroup" id="c-own" hidden><span class="flabel">С … по</span>
              <div style="display:flex;gap:6px"><input type="month" id="c-from"><input type="month" id="c-to"></div></div>
            <div class="fgroup"><span class="flabel">Мера</span>
              <div class="seg" id="c-meas"><button data-v="" class="active">руб.</button><button data-v="в штуках">шт.</button><button data-v="в литрах">л/кг</button></div></div>
            <div class="fgroup"><span class="flabel">Сеть</span><select id="c-net"><option value="">Все сети</option></select></div>
            <div class="fgroup"><span class="flabel">Производитель или бренд</span><input type="text" id="c-obj" list="objs" placeholder="например, NORD"><datalist id="objs"></datalist></div>
            <div class="fgroup"><span class="flabel">&nbsp;</span><button class="btn" id="c-add" title="Добавить выбранное в текст вопроса">Вставить в вопрос</button></div>
          </div>
          <textarea id="q" placeholder="Задайте вопрос о продажах в сетях. Enter — отправить, Shift+Enter — новая строка"></textarea>
          <div class="row">
            <span class="hint" id="qhint">Ответ считается на этом компьютере: обычно 1–3 минуты.</span>
            <span class="sp"></span>
            <button class="btn-accent" id="send">Спросить</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="p-data" hidden></section>
  <section id="p-method" hidden></section>
  <section id="p-eval" hidden></section>
</main>
<div class="tip" id="tip"></div>
<script src="charts.js?v=20261030"></script>
<script src="app.js?v=20261105"></script>
</body>
</html>
